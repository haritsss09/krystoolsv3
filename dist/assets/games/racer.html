<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Track Racer 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1410;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f4f1e8;user-select:none;-webkit-user-select:none}
  canvas#gl{display:block;width:100%;height:100%}
  .hud{position:fixed;top:12px;left:12px;display:grid;gap:4px;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000c;pointer-events:none}
  .hud b{font-size:22px}
  .hud span{font-size:13px;opacity:.85}
  .speed{position:fixed;right:16px;bottom:14px;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 2px 4px #000c;pointer-events:none}
  .speed small{font-size:13px;font-weight:500;opacity:.8;margin-left:4px}
  #map{position:fixed;top:12px;right:12px;width:150px;height:150px;background:#0008;border-radius:10px;border:1px solid #ffffff2a}
  .center{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}
  #count{font-size:min(22vw,140px);font-weight:800;text-shadow:0 4px 12px #000a}
  .card{pointer-events:auto;background:#141c17ee;border:1px solid #ffffff22;border-radius:14px;padding:22px 26px;min-width:240px;text-align:center}
  .card h2{margin:0 0 10px;font-size:22px}
  .card p{margin:4px 0;font-variant-numeric:tabular-nums}
  .card button{margin-top:14px;font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:0;background:#e8b04a;color:#1a1408;cursor:pointer}
  .card button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .help{position:fixed;left:12px;bottom:12px;font-size:12px;opacity:.7;pointer-events:none}
  .mute{position:fixed;top:172px;right:12px;font:inherit;font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid #ffffff33;background:#0008;color:#f4f1e8;cursor:pointer}
  .mute:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .touch{position:fixed;bottom:14px;display:none;gap:10px}
  .touch.l{left:12px}.touch.r{right:110px}
  .touch button{width:64px;height:64px;border-radius:50%;border:1px solid #ffffff44;background:#0007;color:#fff;font-size:22px;touch-action:none}
  @media (pointer:coarse){.touch{display:flex}.help{display:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="hud">
  <b id="lap">Lap 1/3</b>
  <span id="pos">Position 1/4</span>
  <span id="total">Time 0:00.00</span>
  <span id="cur">Lap 0:00.00</span>
  <span id="last">Last lap --</span>
  <span id="best">Best lap --</span>
</div>
<button id="mute" class="mute" type="button">Sound on (M)</button>
<canvas id="map" width="300" height="300"></canvas>
<div class="speed"><span id="kmh">0</span><small>km/h</small></div>
<div class="help">Arrows / WASD to drive · P pause · R restart · M sound</div>
<div class="center"><div id="count"></div></div>
<div class="center" id="overlay" hidden></div>
<div class="touch l"><button data-k="left" aria-label="Steer left">&#9664;</button><button data-k="right" aria-label="Steer right">&#9654;</button></div>
<div class="touch r"><button data-k="down" aria-label="Brake">&#9660;</button><button data-k="up" aria-label="Accelerate">&#9650;</button></div>

<script src="../vendor/three-r128.min.js"></script>
<script>
(function () {
  const LAPS = 3, W = 14, KERB = 1.4, SECTORS = 6, BEST_KEY = 'kt:game:racer:best';
  const $ = (id) => document.getElementById(id);

  const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fc6e0);
  scene.fog = new THREE.Fog(0x9fc6e0, 120, 420);
  const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 800);

  scene.add(new THREE.HemisphereLight(0xdfefff, 0x3d5a2c, 0.75));
  const sun = new THREE.DirectionalLight(0xfff2dd, 0.85);
  sun.position.set(60, 120, 40);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, far: 300 });
  scene.add(sun, sun.target);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), new THREE.MeshLambertMaterial({ color: 0x4f7a37 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const ctrl = [[0,0],[45,0],[82,18],[92,58],[65,92],[22,82],[-18,108],[-68,96],[-92,56],[-78,16],[-42,0]]
    .map(([x, z]) => new THREE.Vector3(x * 1.6, 0, z * 1.6));
  const curve = new THREE.CatmullRomCurve3(ctrl, true, 'catmullrom', 0.5);
  const N = 700;
  const P = curve.getSpacedPoints(N).slice(0, N);
  const T = P.map((_, i) => P[(i + 1) % N].clone().sub(P[(i - 1 + N) % N]).normalize());
  const Nrm = T.map((t) => new THREE.Vector3(t.z, 0, -t.x));

  function strip(offA, offB, yA, yB, colorAt) {
    const pos = [], col = [], c = new THREE.Color();
    for (let i = 0; i < N; i++) {
      const j = (i + 1) % N;
      const a1 = P[i].clone().addScaledVector(Nrm[i], offA).setY(yA);
      const b1 = P[i].clone().addScaledVector(Nrm[i], offB).setY(yB);
      const a2 = P[j].clone().addScaledVector(Nrm[j], offA).setY(yA);
      const b2 = P[j].clone().addScaledVector(Nrm[j], offB).setY(yB);
      for (const v of [a1, b1, a2, b1, b2, a2]) pos.push(v.x, v.y, v.z);
      c.setHex(colorAt(i));
      for (let k = 0; k < 6; k++) col.push(c.r, c.g, c.b);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
    m.receiveShadow = true;
    scene.add(m);
  }
  const half = W / 2, edge = half + KERB;
  strip(half, -half, 0.03, 0.03, (i) => (i < 4 ? ((i % 2) ? 0xffffff : 0x111111) : 0x3b3d40));
  strip(-half + 0.15, -half + 0.45, 0.04, 0.04, () => 0xe9e6dc);
  strip(half - 0.45, half - 0.15, 0.04, 0.04, () => 0xe9e6dc);
  strip(-0.15, 0.15, 0.04, 0.04, (i) => (Math.floor(i / 3) % 2 ? 0x3b3d40 : 0xd8d4c6));
  const kerb = (i) => (Math.floor(i / 2) % 2 ? 0xd23b2f : 0xf2f0ea);
  strip(half, edge, 0.06, 0.06, kerb);
  strip(-half, -edge, 0.06, 0.06, kerb);
  const wall = (i) => (Math.floor(i / 6) % 2 ? 0xc9332a : 0xeeeeee);
  strip(edge, edge, 0, 1.1, wall);
  strip(-edge, -edge, 0, 1.1, wall);

  const gantry = new THREE.Group();
  const postMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
  for (const s of [-1, 1]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.5, 6, 0.5), postMat);
    post.position.set(s * (edge + 0.6), 3, 0);
    gantry.add(post);
  }
  const beam = new THREE.Mesh(new THREE.BoxGeometry(edge * 2 + 1.7, 1.2, 0.5), new THREE.MeshLambertMaterial({ color: 0xe8b04a }));
  beam.position.y = 6;
  gantry.add(beam);
  gantry.position.copy(P[2]);
  gantry.rotation.y = Math.atan2(T[2].x, T[2].z);
  scene.add(gantry);

  const trunk = new THREE.CylinderGeometry(0.35, 0.45, 2, 6), crown = new THREE.ConeGeometry(2.2, 5, 7);
  const trunkM = new THREE.MeshLambertMaterial({ color: 0x6b4a2f }), crownM = new THREE.MeshLambertMaterial({ color: 0x2f5e2a });
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let k = 0, placed = 0; k < 900 && placed < 170; k++) {
    const x = (rnd() - 0.5) * 420, z = (rnd() - 0.5) * 420 + 85;
    let near = Infinity;
    for (let i = 0; i < N; i += 7) near = Math.min(near, (P[i].x - x) ** 2 + (P[i].z - z) ** 2);
    if (near < (edge + 6) ** 2) continue;
    const tree = new THREE.Group();
    const t1 = new THREE.Mesh(trunk, trunkM); t1.position.y = 1;
    const c1 = new THREE.Mesh(crown, crownM); c1.position.y = 4.4; c1.castShadow = true;
    tree.add(t1, c1);
    tree.position.set(x, 0, z);
    tree.scale.setScalar(0.8 + rnd() * 0.7);
    scene.add(tree);
    placed++;
  }

  const bodyG = new THREE.BoxGeometry(2, 0.7, 4.2), cabinG = new THREE.BoxGeometry(1.6, 0.6, 1.9), wingG = new THREE.BoxGeometry(2.1, 0.12, 0.5);
  const cabinM = new THREE.MeshLambertMaterial({ color: 0x1d2a33 }), wingM = new THREE.MeshLambertMaterial({ color: 0x111111 });
  const wheelG = new THREE.CylinderGeometry(0.42, 0.42, 0.4, 12);
  wheelG.rotateZ(Math.PI / 2);
  const wheelM = new THREE.MeshLambertMaterial({ color: 0x151515 });
  function makeCar(color) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(bodyG, new THREE.MeshLambertMaterial({ color }));
    body.position.y = 0.65; body.castShadow = true;
    const cabin = new THREE.Mesh(cabinG, cabinM);
    cabin.position.set(0, 1.25, -0.3); cabin.castShadow = true;
    const wing = new THREE.Mesh(wingG, wingM);
    wing.position.set(0, 1.25, -2);
    g.add(body, cabin, wing);
    const wheels = [];
    for (const [x, z] of [[-1.05, 1.4], [1.05, 1.4], [-1.05, -1.4], [1.05, -1.4]]) {
      const w = new THREE.Mesh(wheelG, wheelM);
      w.position.set(x, 0.42, z);
      g.add(w); wheels.push(w);
    }
    scene.add(g);
    return { g, wheels };
  }
  const { g: car, wheels } = makeCar(0xd8342c);

  let trackLen = 0;
  for (let i = 0; i < N; i++) trackLen += P[i].distanceTo(P[(i + 1) % N]);
  const seg = trackLen / N;
  const turn = T.map((t, i) => t.angleTo(T[(i + 22) % N]));
  const RIVALS = [
    { name: 'Blue', color: 0x2f6fd8, css: '#2f6fd8', vmax: 47, start: N - 6, lane: 3.2 },
    { name: 'Green', color: 0x2fa44f, css: '#2fa44f', vmax: 48, start: N - 16, lane: -3.2 },
    { name: 'Yellow', color: 0xe2b322, css: '#e2b322', vmax: 48, start: N - 16, lane: 3.2 },
  ].map((r) => ({ ...r, ...makeCar(r.color) }));
  const lerpIdx = (u, out) => {
    const w = ((u % N) + N) % N, i = Math.floor(w), f = w - i, j = (i + 1) % N;
    return out.copy(P[i]).lerp(P[j], f);
  };

  let audio = null, muted = localStorage.getItem('kt:game:racer:mute') === '1';
  function startAudio() {
    if (audio || muted) return;
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), sub = ctx.createOscillator(), filt = ctx.createBiquadFilter(), gain = ctx.createGain();
    osc.type = 'sawtooth'; sub.type = 'square';
    filt.type = 'lowpass'; filt.frequency.value = 700;
    gain.gain.value = 0;
    osc.connect(filt); sub.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
    osc.start(); sub.start();
    audio = { ctx, osc, sub, filt, gain };
  }
  function engineSound() {
    if (!audio) return;
    const s = Math.abs(speed), gear = Math.min(4, Math.floor(s / 12)), rpm = (s - gear * 12) / 12;
    const f = 48 + gear * 8 + rpm * 70 + (keys.up ? 6 : 0);
    const now = audio.ctx.currentTime;
    audio.osc.frequency.setTargetAtTime(f, now, 0.05);
    audio.sub.frequency.setTargetAtTime(f / 2, now, 0.05);
    audio.filt.frequency.setTargetAtTime(500 + rpm * 900 + (keys.up ? 300 : 0), now, 0.08);
    audio.gain.gain.setTargetAtTime(paused || muted ? 0 : 0.05 + (keys.up ? 0.03 : 0), now, 0.1);
  }
  function toggleMute() {
    muted = !muted;
    localStorage.setItem('kt:game:racer:mute', muted ? '1' : '0');
    if (!muted) startAudio();
    $('mute').textContent = muted ? 'Sound off (M)' : 'Sound on (M)';
  }

  const map = $('map'), mx = map.getContext('2d');
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const p of P) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z); }
  const sc = 260 / Math.max(maxX - minX, maxZ - minZ);
  const toMap = (x, z) => [150 - (x - (minX + maxX) / 2) * sc, 150 - (z - (minZ + maxZ) / 2) * sc];
  function drawMap() {
    mx.clearRect(0, 0, 300, 300);
    mx.lineJoin = 'round';
    mx.beginPath();
    P.forEach((p, i) => { const [x, y] = toMap(p.x, p.z); i ? mx.lineTo(x, y) : mx.moveTo(x, y); });
    mx.closePath();
    mx.strokeStyle = '#ffffff55'; mx.lineWidth = 16; mx.stroke();
    mx.strokeStyle = '#3b3d40'; mx.lineWidth = 10; mx.stroke();
    const [sx, sy] = toMap(P[0].x, P[0].z);
    mx.fillStyle = '#fff'; mx.fillRect(sx - 4, sy - 4, 8, 8);
    for (const r of RIVALS) {
      const [rx, ry] = toMap(r.g.position.x, r.g.position.z);
      mx.fillStyle = r.css; mx.beginPath(); mx.arc(rx, ry, 6, 0, Math.PI * 2); mx.fill();
    }
    const [cx, cy] = toMap(car.position.x, car.position.z);
    mx.save(); mx.translate(cx, cy); mx.rotate(-heading);
    mx.fillStyle = '#e8b04a'; mx.beginPath(); mx.moveTo(0, -10); mx.lineTo(7, 8); mx.lineTo(-7, 8); mx.closePath(); mx.fill();
    mx.restore();
  }

  const keys = { up: false, down: false, left: false, right: false };
  const keyMap = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
  addEventListener('keydown', (e) => {
    startAudio();
    if (e.code === 'KeyM') toggleMute();
    else if (keyMap[e.code]) { keys[keyMap[e.code]] = true; e.preventDefault(); }
    else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    else if (e.code === 'KeyR') reset();
  });
  addEventListener('keyup', (e) => { if (keyMap[e.code]) keys[keyMap[e.code]] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'race' && !paused) togglePause(); });
  document.querySelectorAll('.touch button').forEach((b) => {
    const k = b.dataset.k;
    b.addEventListener('pointerdown', (e) => { startAudio(); keys[k] = true; b.setPointerCapture(e.pointerId); });
    for (const ev of ['pointerup', 'pointercancel']) b.addEventListener(ev, () => { keys[k] = false; });
  });

  let heading, speed, idx, sector, lap, raceT, lapT, laps, countT, state, paused, shake, best, prog, place;
  const fmt = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(2).padStart(5, '0')}`;
  const overlay = $('overlay');

  function reset() {
    car.position.copy(P[N - 6]).addScaledVector(Nrm[N - 6], -3.2).setY(0);
    heading = Math.atan2(T[N - 6].x, T[N - 6].z);
    speed = 0; idx = N - 6; sector = 0; lap = 1; raceT = 0; lapT = 0; laps = []; prog = -6; place = 0;
    countT = 3.5; state = 'count'; paused = false; shake = 0;
    best = Number(localStorage.getItem(BEST_KEY)) || 0;
    for (const r of RIVALS) { r.u = r.start - N; r.v = 0; r.finishT = 0; r.phase = Math.random() * 6; placeRival(r); }
    overlay.hidden = true; overlay.replaceChildren();
    camera.position.copy(car.position).add(new THREE.Vector3(-Math.sin(heading) * 12, 6, -Math.cos(heading) * 12));
  }

  const rTmp = new THREE.Vector3();
  function placeRival(r) {
    const i = ((Math.floor(r.u) % N) + N) % N;
    lerpIdx(r.u, r.g.position).addScaledVector(Nrm[i], r.lane).setY(0);
    r.g.rotation.y = Math.atan2(T[i].x, T[i].z);
  }
  function updateRivals(dt, racing) {
    for (const r of RIVALS) {
      const i = ((Math.floor(r.u) % N) + N) % N;
      const done = r.u >= LAPS * N;
      const target = done ? 8 : r.vmax * (1 - Math.min(0.2, turn[(i + 8) % N] * 0.25));
      if (racing || state === 'done') r.v += Math.max(-30 * dt, Math.min(22 * dt, target - r.v));
      rTmp.copy(car.position).sub(r.g.position);
      const gap = rTmp.length();
      const ahead = rTmp.dot(T[i]), side = rTmp.dot(Nrm[i]);
      const blocked = gap < 12 && ahead > 0 && Math.abs(side) < 3;
      if (blocked && gap < 4.5) r.v = Math.min(r.v, Math.abs(speed));
      const laneTarget = blocked ? Math.max(-4.2, Math.min(4.2, side - Math.sign(side || 1) * 3.6)) : Math.sin(raceT * 0.25 + r.phase) * 3.4;
      r.lane += (laneTarget - r.lane) * Math.min(1, dt * (blocked ? 2.5 : 0.6));
      r.u += r.v * dt / seg;
      if (!done && r.u >= LAPS * N && !r.finishT) r.finishT = raceT;
      placeRival(r);
      for (const w of r.wheels) w.rotation.x += r.v * dt / 0.42;
      if (gap < 2.6 && gap > 0.01) {
        car.position.addScaledVector(rTmp.normalize(), 2.6 - gap);
        speed *= 0.85;
        shake = Math.min(0.5, shake + 0.15);
      }
    }
  }

  function card(title, lines, label, action) {
    const c = document.createElement('div'); c.className = 'card';
    const h = document.createElement('h2'); h.textContent = title; c.append(h);
    for (const l of lines) { const p = document.createElement('p'); p.textContent = l; c.append(p); }
    const b = document.createElement('button'); b.textContent = label; b.addEventListener('click', action); c.append(b);
    overlay.replaceChildren(c); overlay.hidden = false; b.focus();
  }

  function togglePause() {
    if (state !== 'race' && state !== 'count') return;
    paused = !paused;
    if (paused) card('Paused', ['Press P or Esc to resume'], 'Resume', togglePause);
    else { overlay.hidden = true; overlay.replaceChildren(); }
  }

  function finish() {
    state = 'done';
    place = 1 + RIVALS.filter((r) => r.u >= LAPS * N).length;
    const record = laps.length && Math.min(...laps) <= best;
    const suffix = ['st', 'nd', 'rd', 'th'][place - 1];
    card(`${place}${suffix} place${record ? ' · new best lap!' : ''}`, [`Total ${fmt(raceT)}`, ...laps.map((t, i) => `Lap ${i + 1}  ${fmt(t)}`), `Best lap ${fmt(best)}`], 'Race again', reset);
  }

  function nearest() {
    let bi = idx, bd = Infinity;
    for (let o = -25; o <= 25; o++) {
      const i = (idx + o + N) % N;
      const d = (P[i].x - car.position.x) ** 2 + (P[i].z - car.position.z) ** 2;
      if (d < bd) { bd = d; bi = i; }
    }
    return bi;
  }

  const fwd = new THREE.Vector3(), tmp = new THREE.Vector3(), camTarget = new THREE.Vector3();
  function step(dt) {
    if (state === 'count') {
      countT -= dt;
      $('count').textContent = countT > 0.5 ? String(Math.ceil(countT - 0.5)) : 'GO';
      if (countT <= 0.5) state = 'race';
    } else if (countT > -0.5) {
      countT -= dt;
      if (countT <= -0.5) $('count').textContent = '';
    }
    const racing = state === 'race';
    const MAX = 48, ACC = 22, BRK = 38, DRAG = 0.35;
    if (racing && keys.up) speed += ACC * dt;
    if (racing && keys.down) speed -= (speed > 0 ? BRK : ACC * 0.6) * dt;
    if (!racing && state === 'done') speed *= 1 - 2 * dt;
    speed -= speed * DRAG * dt + Math.sign(speed) * 2 * dt * (keys.up || keys.down ? 0 : 1);
    speed = Math.max(-12, Math.min(MAX, speed));
    if (Math.abs(speed) < 0.05 && !keys.up) speed = 0;
    const steer = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
    const grip = Math.min(1, Math.abs(speed) / 10) * (1 - Math.abs(speed) / MAX * 0.45);
    heading += steer * 2.1 * grip * Math.sign(speed) * dt;

    fwd.set(Math.sin(heading), 0, Math.cos(heading));
    car.position.addScaledVector(fwd, speed * dt);

    const prevIdx = idx;
    idx = nearest();
    let dIdx = idx - prevIdx;
    if (dIdx > N / 2) dIdx -= N; else if (dIdx < -N / 2) dIdx += N;
    prog += dIdx;
    const n = Nrm[idx];
    tmp.copy(car.position).sub(P[idx]);
    const d = tmp.dot(n), limit = edge - 1.15;
    if (Math.abs(d) > limit) {
      car.position.addScaledVector(n, Math.sign(d) * limit - d);
      const tAng = Math.atan2(T[idx].x, T[idx].z) + (fwd.dot(T[idx]) < 0 ? Math.PI : 0);
      let diff = Math.atan2(Math.sin(tAng - heading), Math.cos(tAng - heading));
      heading += diff * 0.35;
      if (Math.abs(speed) > 6) shake = Math.min(0.6, shake + Math.abs(speed) / 80);
      speed *= 0.6;
    }
    const offRoad = Math.abs(d) > half;
    if (offRoad) speed -= speed * 0.9 * dt;

    if (racing) {
      raceT += dt; lapT += dt;
      const s = Math.floor(idx / N * SECTORS);
      if (sector === SECTORS - 1 && s === 0) {
        sector = 0;
        laps.push(lapT);
        if (!best || lapT < best) { best = lapT; localStorage.setItem(BEST_KEY, String(lapT)); }
        lapT = 0;
        if (lap >= LAPS) finish(); else lap++;
      } else if (s === sector + 1) sector = s;
    }
    updateRivals(dt, racing);
    engineSound();

    car.rotation.y = heading;
    for (const w of wheels) w.rotation.x += speed * dt / 0.42;
    wheels[0].rotation.y = wheels[1].rotation.y = steer * 0.35;

    const back = 10 + Math.abs(speed) * 0.08;
    camTarget.copy(car.position).addScaledVector(fwd, -back).setY(4.5 + Math.abs(speed) * 0.03);
    camera.position.lerp(camTarget, Math.min(1, 6 * dt));
    tmp.copy(car.position).addScaledVector(fwd, 6).setY(1.2);
    if (shake > 0) { shake = Math.max(0, shake - dt * 1.8); camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake; }
    camera.lookAt(tmp);
    sun.position.copy(car.position).add(new THREE.Vector3(30, 60, 20));
    sun.target.position.copy(car.position);

    $('lap').textContent = `Lap ${Math.min(lap, LAPS)}/${LAPS}`;
    if (state !== 'done') place = 1 + RIVALS.filter((r) => r.u > prog).length;
    $('pos').textContent = `Position ${place}/${RIVALS.length + 1}`;
    $('last').textContent = `Last lap ${laps.length ? fmt(laps[laps.length - 1]) : '--'}`;
    $('total').textContent = `Time ${fmt(raceT)}`;
    $('cur').textContent = `Lap ${fmt(lapT)}`;
    $('best').textContent = `Best lap ${best ? fmt(best) : '--'}`;
    $('kmh').textContent = String(Math.round(Math.abs(speed) * 3.6));
  }

  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w < h ? 80 : 65;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  $('mute').textContent = muted ? 'Sound off (M)' : 'Sound on (M)';
  $('mute').addEventListener('click', (e) => { toggleMute(); e.currentTarget.blur(); });
  resize();
  reset();

  let last = performance.now();
  (function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) step(dt); else engineSound();
    drawMap();
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
