<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Dino Runner 3D — Sunset Desert</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1b1030;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD Skor - Responsif Desktop & HP Vertikal */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 246, 230, 0.95);
      font-weight: 900;
      font-size: clamp(1rem, 2.6vw, 1.35rem);
      letter-spacing: 0.06em;
      text-shadow: 0 2px 12px rgba(24, 12, 44, 0.75);
      white-space: nowrap;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ff9f43;
      box-shadow: 0 0 10px #ff9f43;
    }

    .brand span {
      color: #ffb84d;
    }

    .score-panel {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(24, 14, 42, 0.52);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 206, 145, 0.28);
      padding: 8px 14px;
      border-radius: 14px;
      color: #fff6e5;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }

    .score-divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 206, 145, 0.22);
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .score-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      color: #ffbe76;
      text-transform: uppercase;
    }

    .score-value {
      font-size: clamp(1.05rem, 2.8vw, 1.5rem);
      font-weight: 800;
      line-height: 1.15;
    }

    .score-pulse {
      animation: pulseScore 0.35s ease;
    }

    @keyframes pulseScore {
      0% { transform: scale(1); color: #fff6e5; }
      50% { transform: scale(1.22); color: #ffd166; }
      100% { transform: scale(1); color: #fff6e5; }
    }

    /* Overlay Start & Game Over */
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at center, rgba(24, 13, 42, 0.28), rgba(16, 9, 28, 0.72));
      z-index: 20;
      transition: opacity 0.25s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(30, 17, 48, 0.84);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 194, 120, 0.34);
      border-radius: 22px;
      padding: 26px 22px;
      text-align: center;
      color: #fff6e5;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.48);
    }

    .card h1 {
      font-size: clamp(1.45rem, 5vw, 2.05rem);
      font-weight: 900;
      letter-spacing: 0.03em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffe5a8, #ff9f43);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card p {
      font-size: 0.9rem;
      color: #e6d5c3;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .stats-row {
      display: none;
      justify-content: center;
      gap: 22px;
      margin-bottom: 18px;
      padding: 11px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 214, 153, 0.14);
      border-radius: 14px;
    }

    .stats-row.visible {
      display: flex;
    }

    .stat-item {
      flex: 1;
    }

    .stat-item span {
      display: block;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #ffbe76;
      margin-bottom: 2px;
    }

    .stat-item strong {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .new-record {
      display: none;
      margin-bottom: 12px;
      padding: 5px 13px;
      border-radius: 999px;
      background: rgba(255, 184, 77, 0.2);
      border: 1px solid #ffb84d;
      color: #ffd166;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .new-record.visible {
      display: inline-block;
    }

    .btn-primary {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff9f43, #ee5253);
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 10px 24px rgba(238, 82, 83, 0.38);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    .controls-hint {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.76rem;
      color: #d7c3b2;
    }

    .hint-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 7px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .key-badge {
      font-weight: 800;
      font-size: 0.72rem;
      color: #ffe29f;
      letter-spacing: 0.03em;
    }

    /* Kontrol Sentuh Mobile (Tombol Menunduk) */
    #mobile-controls {
      position: fixed;
      bottom: calc(22px + env(safe-area-inset-bottom, 0px));
      right: 20px;
      z-index: 15;
      display: none;
    }

    #tap-zone-hint {
      position: fixed;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      left: 20px;
      z-index: 12;
      display: none;
      pointer-events: none;
      color: rgba(255, 238, 210, 0.55);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: rgba(24, 14, 42, 0.35);
      border: 1px solid rgba(255, 214, 153, 0.18);
      padding: 6px 11px;
      border-radius: 999px;
    }

    @media (pointer: coarse), (max-width: 768px) {
      #mobile-controls {
        display: block;
      }
      #tap-zone-hint {
        display: block;
      }
      #hud {
        padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 10px;
      }
      .score-panel {
        gap: 10px;
        padding: 7px 11px;
        border-radius: 12px;
      }
      .score-divider {
        height: 20px;
      }
      .card {
        max-width: 340px;
        padding: 22px 18px;
        border-radius: 20px;
      }
    }

    @media (max-width: 360px) {
      .brand {
        font-size: 0.92rem;
      }
      .score-value {
        font-size: 0.98rem;
      }
      .controls-hint {
        grid-template-columns: 1fr;
      }
    }

    #duck-btn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: 2px solid rgba(255, 214, 153, 0.52);
      background: rgba(28, 16, 46, 0.64);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffe29f;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38);
      transition: transform 0.1s ease, background 0.12s ease;
    }

    #duck-btn.active {
      background: rgba(255, 159, 67, 0.62);
      border-color: #ffe29f;
      transform: scale(0.92);
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div class="brand"><span class="brand-dot"></span>DINO <span>3D</span></div>
    <div class="score-panel">
      <div class="score-box">
        <span class="score-label">Best</span>
        <span class="score-value" id="high-score">00000</span>
      </div>
      <div class="score-divider"></div>
      <div class="score-box">
        <span class="score-label">Score</span>
        <span class="score-value" id="current-score">00000</span>
      </div>
    </div>
  </div>

  <div id="tap-zone-hint">TAP LAYAR: LOMPAT</div>

  <div id="overlay">
    <div class="card">
      <div class="new-record" id="new-record-badge">Rekor Baru!</div>
      <h1 id="overlay-title">DINO RUNNER 3D</h1>
      <p id="overlay-desc">Lari melintasi gurun senja, lompati kaktus, dan menunduk untuk menghindari pterodactyl!</p>
      <div class="stats-row" id="stats-row">
        <div class="stat-item">
          <span>Skor Akhir</span>
          <strong id="final-score">0</strong>
        </div>
        <div class="stat-item">
          <span>Terbaik</span>
          <strong id="final-high">0</strong>
        </div>
      </div>
      <button class="btn-primary" id="start-btn">MULAI LARI</button>
      <div class="controls-hint">
        <div class="hint-pill">
          <span class="key-badge">SPASI / ↑ / TAP</span>
          <span>Lompat</span>
        </div>
        <div class="hint-pill">
          <span class="key-badge">↓ / SWIPE / TAHAN</span>
          <span>Menunduk</span>
        </div>
      </div>
    </div>
  </div>

  <div id="mobile-controls">
    <button id="duck-btn" aria-label="Menunduk">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12l7 7 7-7"/>
      </svg>
      TUNDUK
    </button>
  </div>

  <script src="../vendor/three-r128.min.js"></script>
  <script>
    function bootDinoGame() {
      if (!window.THREE) {
        const desc = document.getElementById('overlay-desc');
        if (desc) {
          desc.textContent = 'Gagal memuat Three.js. Pastikan koneksi internet aktif lalu muat ulang halaman.';
        }
        return;
      }

      // --- SAFE STORAGE ---
      const storage = {
        get(key, fallback = '0') {
          try {
            return window.localStorage.getItem(key) ?? fallback;
          } catch (_) {
            return fallback;
          }
        },
        set(key, val) {
          try {
            window.localStorage.setItem(key, val);
          } catch (_) {}
        }
      };

      // --- KONFIGURASI GAME ---
      const CONFIG = {
        dinoX: -3.5,
        groundY: 0,
        gravity: 44,
        jumpVelocity: 16.2,
        fastFallMultiplier: 2.6,
        baseSpeed: 15,
        maxSpeed: 38,
        speedAccel: 0.42,
        spawnX: 44,
        despawnX: -18
      };

      // --- STATE GAME ---
      let state = 'IDLE'; // 'IDLE' | 'PLAYING' | 'GAMEOVER'
      let score = 0;
      let highScore = parseInt(storage.get('dino3d_highscore', '0'), 10) || 0;
      let lastMilestone = 0;
      let speed = CONFIG.baseSpeed;
      let dinoY = 0;
      let dinoVy = 0;
      let isGrounded = true;
      let isDucking = false;
      let runCycle = 0;
      let spawnTimer = 0;
      let nextSpawnInterval = 1.4;

      const obstacles = [];
      const clouds = [];
      const dunes = [];
      const mesas = [];
      const pebbles = [];
      const dustParticles = [];
      let dustTimer = 0;

      // --- DOM ELEMENTS ---
      const canvas = document.getElementById('game-canvas');
      const scoreEl = document.getElementById('current-score');
      const highScoreEl = document.getElementById('high-score');
      const overlayEl = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const statsRow = document.getElementById('stats-row');
      const finalScoreEl = document.getElementById('final-score');
      const finalHighEl = document.getElementById('final-high');
      const newRecordBadge = document.getElementById('new-record-badge');
      const startBtn = document.getElementById('start-btn');
      const duckBtn = document.getElementById('duck-btn');

      const formatScore = (val) => String(Math.floor(val)).padStart(5, '0');
      highScoreEl.textContent = formatScore(highScore);

      // --- SETUP THREE.JS SCENE ---
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0xdf724c, 0.0115);

      const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 220);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.06;

      function updateCameraLayout() {
        const aspect = window.innerWidth / window.innerHeight;
        camera.aspect = aspect;
        if (aspect < 1) {
          // Kamera khusus HP vertikal: Dino ditempatkan di sisi kiri bawah, jarak pandang ke depan tetap panjang
          const portraitFactor = Math.min(1.65, Math.max(1.05, 0.88 / aspect));
          camera.fov = 52;
          camera.position.set(
            -11.2 - (portraitFactor - 1) * 3.4,
            4.6 + (portraitFactor - 1) * 1.5,
            9.6 * portraitFactor
          );
          camera.lookAt(4.6, 1.45, 0);
        } else {
          camera.fov = 46;
          camera.position.set(-10.2, 4.2, 8.8);
          camera.lookAt(2.8, 1.35, 0);
        }
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      updateCameraLayout();

      // --- LANGIT SENJA BERBINTANG & BULAN/MATAHARI JAUH ---
      let starPoints = null;
      function createSunsetSky() {
        const skyCanvas = document.createElement('canvas');
        skyCanvas.width = 32;
        skyCanvas.height = 256;
        const ctx = skyCanvas.getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, 0, 256);
        grad.addColorStop(0.0, '#140c29');
        grad.addColorStop(0.24, '#361b4d');
        grad.addColorStop(0.44, '#8f3357');
        grad.addColorStop(0.60, '#e36d42');
        grad.addColorStop(0.74, '#ffb563');
        grad.addColorStop(1.0, '#ffe4a6');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 32, 256);

        const skyTex = new THREE.CanvasTexture(skyCanvas);
        const skyGeo = new THREE.SphereGeometry(155, 28, 18);
        const skyMat = new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false });
        const skyDome = new THREE.Mesh(skyGeo, skyMat);
        scene.add(skyDome);

        // Bintang senja halus di bagian atas langit
        const starCount = 140;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.random() * 0.42 * Math.PI; // Hanya di belahan langit atas
          const r = 142;
          starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          starPositions[i * 3 + 1] = r * Math.cos(phi);
          starPositions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
        }
        const starGeo = new THREE.BufferGeometry();
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({
          color: 0xfff3d6,
          size: 0.75,
          transparent: true,
          opacity: 0.75,
          fog: false
        });
        starPoints = new THREE.Points(starGeo, starMat);
        scene.add(starPoints);

        // Bulan / Matahari senja jauh di cakrawala dengan halo atmosfer lembut
        const celestialGroup = new THREE.Group();
        celestialGroup.position.set(106, 15.5, -62);

        const coreGeo = new THREE.CircleGeometry(4.6, 32);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xfff0c2, fog: false });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);

        const haloCanvas = document.createElement('canvas');
        haloCanvas.width = 128;
        haloCanvas.height = 128;
        const hCtx = haloCanvas.getContext('2d');
        const hGrad = hCtx.createRadialGradient(64, 64, 14, 64, 64, 64);
        hGrad.addColorStop(0.0, 'rgba(255, 232, 168, 0.55)');
        hGrad.addColorStop(0.45, 'rgba(255, 178, 102, 0.22)');
        hGrad.addColorStop(1.0, 'rgba(255, 140, 80, 0.0)');
        hCtx.fillStyle = hGrad;
        hCtx.fillRect(0, 0, 128, 128);

        const haloTex = new THREE.CanvasTexture(haloCanvas);
        const haloMat = new THREE.MeshBasicMaterial({
          map: haloTex,
          transparent: true,
          depthWrite: false,
          fog: false
        });
        const haloMesh = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), haloMat);
        haloMesh.position.z = -0.2;

        celestialGroup.add(haloMesh, coreMesh);
        celestialGroup.lookAt(0, 3, 0);
        scene.add(celestialGroup);
      }
      createSunsetSky();

      // --- PENCAHAYAAN & BAYANGAN ---
      const hemiLight = new THREE.HemisphereLight(0xffc299, 0x5c331d, 0.92);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffd28e, 1.4);
      dirLight.position.set(24, 25, -16);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.near = 2;
      dirLight.shadow.camera.far = 75;
      const d = 22;
      dirLight.shadow.camera.left = -d;
      dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d;
      dirLight.shadow.camera.bottom = -d;
      dirLight.shadow.bias = -0.0005;
      scene.add(dirLight);

      // --- GURUN PASIR & JALUR LINTASAN ---
      const groundGeo = new THREE.PlaneGeometry(280, 180, 28, 16);
      groundGeo.rotateX(-Math.PI / 2);
      const groundMat = new THREE.MeshStandardMaterial({
        color: 0xd68f54,
        roughness: 0.92,
        metalness: 0.02,
        flatShading: true
      });
      const groundMesh = new THREE.Mesh(groundGeo, groundMat);
      groundMesh.receiveShadow = true;
      scene.add(groundMesh);

      const trackGeo = new THREE.PlaneGeometry(280, 3.1);
      trackGeo.rotateX(-Math.PI / 2);
      const trackMat = new THREE.MeshStandardMaterial({
        color: 0xe6ab6e,
        roughness: 0.86,
        flatShading: true
      });
      const trackMesh = new THREE.Mesh(trackGeo, trackMat);
      trackMesh.position.y = 0.01;
      trackMesh.receiveShadow = true;
      scene.add(trackMesh);

      // Garis tepi lintasan pasir halus
      const borderGeo = new THREE.PlaneGeometry(280, 0.14);
      borderGeo.rotateX(-Math.PI / 2);
      const borderMat = new THREE.MeshStandardMaterial({
        color: 0xc2773e,
        roughness: 0.9,
        flatShading: true
      });
      const borderLeft = new THREE.Mesh(borderGeo, borderMat);
      borderLeft.position.set(0, 0.015, 1.55);
      const borderRight = new THREE.Mesh(borderGeo, borderMat);
      borderRight.position.set(0, 0.015, -1.55);
      scene.add(borderLeft, borderRight);

      // --- MODEL DINO T-REX LOW-POLY HIJAU ---
      const dinoGroup = new THREE.Group();
      dinoGroup.position.set(CONFIG.dinoX, 0, 0);
      scene.add(dinoGroup);

      // Bayangan kontak di tanah agar lompatan lebih presisi secara visual
      const contactShadowGeo = new THREE.CircleGeometry(0.85, 20);
      contactShadowGeo.rotateX(-Math.PI / 2);
      const contactShadowMat = new THREE.MeshBasicMaterial({
        color: 0x3b1d0e,
        transparent: true,
        opacity: 0.32
      });
      const contactShadow = new THREE.Mesh(contactShadowGeo, contactShadowMat);
      contactShadow.position.set(CONFIG.dinoX, 0.02, 0);
      contactShadow.scale.set(1.25, 1, 0.72);
      scene.add(contactShadow);

      const dinoGreenMat = new THREE.MeshStandardMaterial({
        color: 0x3da35d,
        roughness: 0.62,
        flatShading: true
      });
      const dinoDarkGreenMat = new THREE.MeshStandardMaterial({
        color: 0x266e3d,
        roughness: 0.68,
        flatShading: true
      });
      const dinoBellyMat = new THREE.MeshStandardMaterial({
        color: 0x9ef0b8,
        roughness: 0.72,
        flatShading: true
      });
      const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const eyePupilMat = new THREE.MeshBasicMaterial({ color: 0x111111 });

      function createBox(w, h, d, mat, x, y, z) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      function createDinoLeg(zOffset) {
        const pivot = new THREE.Group();
        pivot.position.set(-0.05, 0.85, zOffset);
        const thigh = createBox(0.34, 0.45, 0.24, dinoGreenMat, 0, -0.2, 0);
        const shin = createBox(0.24, 0.42, 0.2, dinoDarkGreenMat, -0.03, -0.58, 0);
        const foot = createBox(0.42, 0.14, 0.24, dinoGreenMat, 0.06, -0.78, 0);
        pivot.add(thigh, shin, foot);
        return pivot;
      }

      const leftLeg = createDinoLeg(0.24);
      const rightLeg = createDinoLeg(-0.24);
      dinoGroup.add(leftLeg, rightLeg);

      const dinoBody = new THREE.Group();
      dinoBody.position.set(0, 0.95, 0);
      dinoGroup.add(dinoBody);

      dinoBody.add(createBox(1.12, 1.02, 0.76, dinoGreenMat, 0.05, 0.35, 0));
      dinoBody.add(createBox(0.75, 0.78, 0.56, dinoBellyMat, 0.28, 0.32, 0));
      dinoBody.add(createBox(0.55, 0.55, 0.54, dinoGreenMat, 0.48, 0.92, 0));
      dinoBody.add(createBox(0.96, 0.62, 0.66, dinoGreenMat, 0.74, 1.32, 0));
      dinoBody.add(createBox(0.76, 0.2, 0.52, dinoDarkGreenMat, 0.80, 0.92, 0));

      // Mata & kilau mata
      dinoBody.add(createBox(0.17, 0.17, 0.06, eyeWhiteMat, 0.76, 1.40, 0.34));
      dinoBody.add(createBox(0.09, 0.09, 0.07, eyePupilMat, 0.79, 1.40, 0.345));
      dinoBody.add(createBox(0.17, 0.17, 0.06, eyeWhiteMat, 0.76, 1.40, -0.34));
      dinoBody.add(createBox(0.09, 0.09, 0.07, eyePupilMat, 0.79, 1.40, -0.345));

      // Ekor
      dinoBody.add(createBox(0.62, 0.62, 0.54, dinoGreenMat, -0.66, 0.28, 0));
      dinoBody.add(createBox(0.56, 0.42, 0.38, dinoGreenMat, -1.16, 0.35, 0));
      dinoBody.add(createBox(0.48, 0.24, 0.22, dinoDarkGreenMat, -1.60, 0.42, 0));

      // Duri punggung
      dinoBody.add(createBox(0.18, 0.22, 0.16, dinoDarkGreenMat, 0.22, 0.92, 0));
      dinoBody.add(createBox(0.18, 0.22, 0.16, dinoDarkGreenMat, -0.15, 0.88, 0));
      dinoBody.add(createBox(0.18, 0.18, 0.14, dinoDarkGreenMat, -0.55, 0.66, 0));

      // Tangan mungil
      const leftArm = createBox(0.36, 0.14, 0.14, dinoDarkGreenMat, 0.66, 0.42, 0.42);
      leftArm.rotation.z = -0.35;
      const rightArm = createBox(0.36, 0.14, 0.14, dinoDarkGreenMat, 0.66, 0.42, -0.42);
      rightArm.rotation.z = -0.35;
      dinoBody.add(leftArm, rightArm);

      // --- DEKORASI AWAN, TEBING MESA, BUKIT PASIR & KERIKIL ---
      const cloudMat = new THREE.MeshStandardMaterial({
        color: 0xffd9be,
        emissive: 0x6b3042,
        emissiveIntensity: 0.28,
        roughness: 0.9,
        flatShading: true
      });

      function spawnCloud(xPos) {
        const group = new THREE.Group();
        const puffs = 3 + Math.floor(Math.random() * 3);
        for (let i = 0; i < puffs; i++) {
          const w = 1.6 + Math.random() * 1.8;
          const h = 0.75 + Math.random() * 0.65;
          const d = 1.2 + Math.random() * 1.2;
          const mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.8, 0), cloudMat);
          mesh.scale.set(w, h, d);
          mesh.position.set((i - puffs / 2) * 1.35, (Math.random() - 0.5) * 0.35, (Math.random() - 0.5) * 0.8);
          group.add(mesh);
        }
        group.position.set(xPos, 9.2 + Math.random() * 6.0, -12 - Math.random() * 24);
        scene.add(group);
        clouds.push({ mesh: group, speedFactor: 0.12 + Math.random() * 0.08 });
      }

      for (let i = 0; i < 10; i++) {
        spawnCloud(-25 + i * 13);
      }

      // Tebing batu gurun (Mesas) di cakrawala untuk siluet kedalaman
      const mesaMat = new THREE.MeshStandardMaterial({
        color: 0x9e5138,
        roughness: 0.95,
        flatShading: true
      });

      function spawnMesa(xPos) {
        const topW = 2.6 + Math.random() * 3.8;
        const botW = topW * (1.45 + Math.random() * 0.35);
        const h = 3.2 + Math.random() * 4.8;
        const geo = new THREE.CylinderGeometry(topW, botW, h, 6);
        const mesh = new THREE.Mesh(geo, mesaMat);
        mesh.position.set(xPos, h * 0.48, -32 - Math.random() * 24);
        mesh.rotation.y = Math.random() * Math.PI;
        scene.add(mesh);
        mesas.push(mesh);
      }

      for (let i = 0; i < 11; i++) {
        spawnMesa(-30 + i * 14);
      }

      const duneMat = new THREE.MeshStandardMaterial({
        color: 0xc97a40,
        roughness: 0.95,
        flatShading: true
      });

      function spawnDune(xPos) {
        const isFar = Math.random() > 0.35;
        const zPos = isFar ? (-5.5 - Math.random() * 22) : (4.2 + Math.random() * 9);
        const radius = 1.4 + Math.random() * 3.0;
        const height = 0.75 + Math.random() * 2.1;
        const geo = new THREE.ConeGeometry(radius, height, 5);
        const mesh = new THREE.Mesh(geo, duneMat);
        mesh.position.set(xPos, height * 0.44, zPos);
        mesh.rotation.y = Math.random() * Math.PI;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        dunes.push(mesh);
      }

      for (let i = 0; i < 22; i++) {
        spawnDune(-25 + i * 4.8);
      }

      // Batu & kerikil gurun di pinggir jalur lintasan
      const pebbleMat = new THREE.MeshStandardMaterial({
        color: 0xa65e32,
        roughness: 0.92,
        flatShading: true
      });
      const pebbleGeo = new THREE.DodecahedronGeometry(0.14, 0);

      for (let i = 0; i < 28; i++) {
        const mesh = new THREE.Mesh(pebbleGeo, pebbleMat);
        const side = Math.random() > 0.5 ? 1 : -1;
        mesh.position.set(
          -20 + Math.random() * 75,
          0.06,
          side * (1.7 + Math.random() * 2.2)
        );
        mesh.scale.set(0.7 + Math.random() * 1.1, 0.5 + Math.random() * 0.6, 0.7 + Math.random() * 1.1);
        mesh.rotation.set(Math.random(), Math.random(), Math.random());
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        pebbles.push(mesh);
      }

      // --- PARTIKEL DEBU SAAT LARI ---
      const dustGeo = new THREE.DodecahedronGeometry(0.16, 0);
      const dustMat = new THREE.MeshStandardMaterial({
        color: 0xf5cc93,
        transparent: true,
        opacity: 0.82,
        flatShading: true
      });

      function emitDust(count = 1, boost = false) {
        for (let i = 0; i < count; i++) {
          const mesh = new THREE.Mesh(dustGeo, dustMat.clone());
          mesh.position.set(
            CONFIG.dinoX - 0.3 + (Math.random() - 0.5) * 0.4,
            0.15 + Math.random() * 0.15,
            (Math.random() - 0.5) * 0.5
          );
          const s = (boost ? 1.1 : 0.7) + Math.random() * 0.6;
          mesh.scale.set(s, s, s);
          scene.add(mesh);
          dustParticles.push({
            mesh,
            vx: -speed * (0.45 + Math.random() * 0.3),
            vy: (boost ? 2.4 : 1.1) + Math.random() * 1.4,
            vz: (Math.random() - 0.5) * 1.8,
            life: 0,
            maxLife: 0.32 + Math.random() * 0.18
          });
        }
      }

      // --- RINTANGAN: KAKTUS & PTERODACTYL ---
      const cactusMat = new THREE.MeshStandardMaterial({
        color: 0x2b6e4e,
        roughness: 0.72,
        flatShading: true
      });
      const cactusFlowerMat = new THREE.MeshStandardMaterial({
        color: 0xff595e,
        roughness: 0.5,
        flatShading: true
      });
      const pteroBodyMat = new THREE.MeshStandardMaterial({
        color: 0x9b2226,
        roughness: 0.62,
        flatShading: true
      });
      const pteroWingMat = new THREE.MeshStandardMaterial({
        color: 0xd96b0b,
        roughness: 0.62,
        flatShading: true,
        side: THREE.DoubleSide
      });
      const beakMat = new THREE.MeshStandardMaterial({
        color: 0xf4a200,
        roughness: 0.48,
        flatShading: true
      });

      function buildSingleCactus(scale = 1, withFlower = false) {
        const g = new THREE.Group();
        const trunk = createBox(0.42, 1.65, 0.42, cactusMat, 0, 0.825, 0);
        const armL = createBox(0.32, 0.18, 0.24, cactusMat, 0, 0.95, 0.32);
        const tipL = createBox(0.24, 0.45, 0.24, cactusMat, 0, 1.18, 0.42);
        const armR = createBox(0.32, 0.18, 0.24, cactusMat, 0, 0.75, -0.32);
        const tipR = createBox(0.24, 0.42, 0.24, cactusMat, 0, 0.98, -0.42);
        g.add(trunk, armL, tipL, armR, tipR);
        if (withFlower) {
          g.add(createBox(0.18, 0.14, 0.18, cactusFlowerMat, 0, 1.72, 0));
        }
        g.scale.setScalar(scale);
        return g;
      }

      function spawnCactus() {
        const variant = Math.floor(Math.random() * 3);
        const group = new THREE.Group();
        let halfW = 0.35;
        let height = 1.65;

        if (variant === 0) {
          group.add(buildSingleCactus(1.08, true));
          halfW = 0.32;
          height = 1.75;
        } else if (variant === 1) {
          const c1 = buildSingleCactus(0.95, true);
          c1.position.x = -0.38;
          const c2 = buildSingleCactus(0.85, false);
          c2.position.x = 0.38;
          group.add(c1, c2);
          halfW = 0.68;
          height = 1.52;
        } else {
          const c1 = buildSingleCactus(0.76, false);
          c1.position.x = -0.58;
          const c2 = buildSingleCactus(0.84, true);
          c2.position.x = 0;
          const c3 = buildSingleCactus(0.72, false);
          c3.position.x = 0.58;
          group.add(c1, c2, c3);
          halfW = 0.85;
          height = 1.35;
        }

        group.position.set(CONFIG.spawnX, 0, 0);
        scene.add(group);

        obstacles.push({
          type: 'cactus',
          mesh: group,
          minY: 0,
          maxY: height,
          halfW,
          halfD: 0.35,
          speedMult: 1
        });
      }

      function spawnPterodactyl() {
        const group = new THREE.Group();
        const body = createBox(0.95, 0.34, 0.36, pteroBodyMat, 0, 0, 0);
        const crest = createBox(0.45, 0.24, 0.14, pteroBodyMat, -0.25, 0.24, 0);
        const beak = createBox(0.55, 0.16, 0.18, beakMat, -0.68, -0.02, 0);

        const leftWingPivot = new THREE.Group();
        leftWingPivot.position.set(0, 0.08, 0.18);
        const leftWing = createBox(0.52, 0.08, 1.15, pteroWingMat, 0, 0, 0.56);
        leftWingPivot.add(leftWing);

        const rightWingPivot = new THREE.Group();
        rightWingPivot.position.set(0, 0.08, -0.18);
        const rightWing = createBox(0.52, 0.08, 1.15, pteroWingMat, 0, 0, -0.56);
        rightWingPivot.add(rightWing);

        group.add(body, crest, beak, leftWingPivot, rightWingPivot);

        const isHigh = Math.random() > 0.42;
        const centerY = isHigh ? 2.05 : 0.85;
        group.position.set(CONFIG.spawnX, centerY, 0);
        scene.add(group);

        obstacles.push({
          type: 'ptero',
          mesh: group,
          leftWing: leftWingPivot,
          rightWing: rightWingPivot,
          flapPhase: Math.random() * Math.PI * 2,
          minY: centerY - 0.28,
          maxY: centerY + 0.28,
          halfW: 0.55,
          halfD: 0.5,
          speedMult: 1.12
        });
      }

      // --- KONTROL INPUT ---
      function jump() {
        if (state === 'IDLE' || state === 'GAMEOVER') {
          startGame();
          return;
        }
        if (state === 'PLAYING' && isGrounded) {
          dinoVy = CONFIG.jumpVelocity;
          isGrounded = false;
          isDucking = false;
          duckBtn.classList.remove('active');
          emitDust(6, true);
        }
      }

      function setDuck(active) {
        if (state !== 'PLAYING') return;
        isDucking = active;
        duckBtn.classList.toggle('active', active);
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
          e.preventDefault();
          jump();
        } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
          e.preventDefault();
          setDuck(true);
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowDown' || e.code === 'KeyS') {
          setDuck(false);
        }
      });

      let touchStartY = 0;
      let touchMovedDown = false;

      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) {
          touchStartY = e.touches[0].clientY;
          touchMovedDown = false;
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0 && state === 'PLAYING') {
          const dy = e.touches[0].clientY - touchStartY;
          if (dy > 28 && !touchMovedDown) {
            touchMovedDown = true;
            setDuck(true);
          }
        }
      }, { passive: true });

      canvas.addEventListener('touchend', () => {
        if (touchMovedDown) {
          setDuck(false);
          touchMovedDown = false;
        } else {
          jump();
        }
      });

      canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0) jump();
      });

      duckBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        setDuck(true);
      });
      duckBtn.addEventListener('touchend', (e) => {
        e.preventDefault();
        e.stopPropagation();
        setDuck(false);
      });
      duckBtn.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        setDuck(true);
      });
      duckBtn.addEventListener('mouseup', (e) => {
        e.stopPropagation();
        setDuck(false);
      });

      function handleStartTrigger(e) {
        e.preventDefault();
        e.stopPropagation();
        startGame();
      }
      startBtn.addEventListener('click', handleStartTrigger);
      startBtn.addEventListener('touchend', handleStartTrigger);

      window.addEventListener('resize', updateCameraLayout);

      // --- ALUR GAME (START / GAME OVER) ---
      function clearObstacles() {
        while (obstacles.length > 0) {
          const obs = obstacles.pop();
          scene.remove(obs.mesh);
        }
      }

      function startGame() {
        clearObstacles();
        score = 0;
        lastMilestone = 0;
        speed = CONFIG.baseSpeed;
        dinoY = 0;
        dinoVy = 0;
        isGrounded = true;
        isDucking = false;
        duckBtn.classList.remove('active');
        spawnTimer = 0.6;
        nextSpawnInterval = 1.2;

        dinoGroup.position.y = 0;
        dinoBody.rotation.z = 0;
        dinoBody.position.y = 0.95;
        contactShadow.scale.set(1.25, 1, 0.72);
        contactShadow.material.opacity = 0.32;

        scoreEl.textContent = formatScore(0);
        overlayEl.classList.add('hidden');
        state = 'PLAYING';
      }

      function triggerGameOver() {
        state = 'GAMEOVER';
        isDucking = false;
        duckBtn.classList.remove('active');

        const finalVal = Math.floor(score);
        let isNewRecord = false;
        if (finalVal > highScore) {
          highScore = finalVal;
          storage.set('dino3d_highscore', String(highScore));
          highScoreEl.textContent = formatScore(highScore);
          isNewRecord = true;
        }

        overlayTitle.textContent = 'GAME OVER';
        overlayDesc.textContent = 'Tabrakan! Tetap fokus dan jaga ritme lompatanmu.';
        finalScoreEl.textContent = formatScore(finalVal);
        finalHighEl.textContent = formatScore(highScore);
        statsRow.classList.add('visible');
        newRecordBadge.classList.toggle('visible', isNewRecord);
        startBtn.textContent = 'MAIN LAGI';
        overlayEl.classList.remove('hidden');
      }

      // --- DETEKSI TABRAKAN AABB ---
      function checkCollisions() {
        const dMinX = CONFIG.dinoX - (isDucking ? 0.52 : 0.38);
        const dMaxX = CONFIG.dinoX + (isDucking ? 0.92 : 0.62);
        const dMinY = dinoY + 0.08;
        const dMaxY = dinoY + (isDucking ? 1.42 : 2.42);
        const dMinZ = -0.32;
        const dMaxZ = 0.32;

        for (let i = 0; i < obstacles.length; i++) {
          const obs = obstacles[i];
          const ox = obs.mesh.position.x;
          const oz = obs.mesh.position.z;

          const overlapX = dMaxX > (ox - obs.halfW) && dMinX < (ox + obs.halfW);
          const overlapY = dMaxY > obs.minY && dMinY < obs.maxY;
          const overlapZ = dMaxZ > (oz - obs.halfD) && dMinZ < (oz + obs.halfD);

          if (overlapX && overlapY && overlapZ) {
            return true;
          }
        }
        return false;
      }

      // --- GAME LOOP UTAMA ---
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);

        // Kilau bintang halus
        if (starPoints) {
          starPoints.material.opacity = 0.58 + Math.sin(clock.elapsedTime * 1.8) * 0.18;
        }

        // Gerak awan latar belakang
        for (let i = 0; i < clouds.length; i++) {
          const c = clouds[i];
          c.mesh.position.x -= (state === 'PLAYING' ? speed : 4) * c.speedFactor * dt;
          if (c.mesh.position.x < -38) {
            c.mesh.position.x = 75 + Math.random() * 15;
          }
        }

        // Update partikel debu
        for (let i = dustParticles.length - 1; i >= 0; i--) {
          const p = dustParticles[i];
          p.life += dt;
          if (p.life >= p.maxLife) {
            scene.remove(p.mesh);
            p.mesh.material.dispose();
            dustParticles.splice(i, 1);
            continue;
          }
          p.mesh.position.x += p.vx * dt;
          p.mesh.position.y += p.vy * dt;
          p.mesh.position.z += p.vz * dt;
          p.vy -= 4.5 * dt;
          const progress = p.life / p.maxLife;
          p.mesh.material.opacity = 0.78 * (1 - progress);
          const scale = 1 - progress * 0.6;
          p.mesh.scale.setScalar(scale);
        }

        if (state === 'PLAYING') {
          speed = Math.min(CONFIG.maxSpeed, speed + CONFIG.speedAccel * dt);

          score += speed * dt * 0.75;
          scoreEl.textContent = formatScore(score);

          const currentMilestone = Math.floor(score / 100);
          if (currentMilestone > lastMilestone && currentMilestone > 0) {
            lastMilestone = currentMilestone;
            scoreEl.classList.remove('score-pulse');
            void scoreEl.offsetWidth;
            scoreEl.classList.add('score-pulse');
          }

          if (!isGrounded) {
            const grav = isDucking ? CONFIG.gravity * CONFIG.fastFallMultiplier : CONFIG.gravity;
            dinoVy -= grav * dt;
            dinoY += dinoVy * dt;

            if (dinoY <= CONFIG.groundY) {
              dinoY = CONFIG.groundY;
              dinoVy = 0;
              isGrounded = true;
              emitDust(5, true);
            }
          }
          dinoGroup.position.y = dinoY;

          // Skala bayangan kontak mengikuti ketinggian lompat dino
          const heightFactor = Math.max(0.35, 1 - dinoY * 0.16);
          contactShadow.scale.set(1.25 * heightFactor, 1, 0.72 * heightFactor);
          contactShadow.material.opacity = 0.32 * heightFactor;

          const targetBodyRot = (isDucking && isGrounded) ? -0.62 : 0;
          const targetBodyY = (isDucking && isGrounded) ? 0.66 : 0.95;
          dinoBody.rotation.z += (targetBodyRot - dinoBody.rotation.z) * Math.min(1, dt * 18);
          dinoBody.position.y += (targetBodyY - dinoBody.position.y) * Math.min(1, dt * 18);

          if (isGrounded) {
            runCycle += dt * speed * 1.15;
            const swing = Math.sin(runCycle) * 0.72;
            leftLeg.rotation.z = swing;
            rightLeg.rotation.z = -swing;
            dinoBody.position.y += Math.abs(Math.cos(runCycle)) * 0.05;

            dustTimer += dt;
            if (dustTimer >= 0.09) {
              dustTimer = 0;
              emitDust(1, false);
            }
          } else {
            leftLeg.rotation.z = 0.25;
            rightLeg.rotation.z = -0.25;
          }

          // Scroll tebing mesa, bukit pasir & kerikil
          for (let i = 0; i < mesas.length; i++) {
            mesas[i].position.x -= speed * 0.22 * dt;
            if (mesas[i].position.x < -45) {
              mesas[i].position.x = 95 + Math.random() * 18;
            }
          }

          for (let i = 0; i < dunes.length; i++) {
            dunes[i].position.x -= speed * dt;
            if (dunes[i].position.x < -30) {
              dunes[i].position.x = 72 + Math.random() * 14;
            }
          }

          for (let i = 0; i < pebbles.length; i++) {
            pebbles[i].position.x -= speed * dt;
            if (pebbles[i].position.x < -22) {
              pebbles[i].position.x = 55 + Math.random() * 16;
            }
          }

          // Spawn rintangan acak
          spawnTimer += dt;
          if (spawnTimer >= nextSpawnInterval) {
            spawnTimer = 0;
            const canSpawnPtero = score > 120;
            if (canSpawnPtero && Math.random() < 0.36) {
              spawnPterodactyl();
            } else {
              spawnCactus();
            }
            const minGapTime = Math.max(0.68, 17.5 / speed);
            nextSpawnInterval = minGapTime + Math.random() * 0.65;
          }

          for (let i = obstacles.length - 1; i >= 0; i--) {
            const obs = obstacles[i];
            obs.mesh.position.x -= speed * obs.speedMult * dt;

            if (obs.type === 'ptero') {
              obs.flapPhase += dt * 13;
              const flap = Math.sin(obs.flapPhase) * 0.65;
              obs.leftWing.rotation.x = flap;
              obs.rightWing.rotation.x = -flap;
            }

            if (obs.mesh.position.x < CONFIG.despawnX) {
              scene.remove(obs.mesh);
              obstacles.splice(i, 1);
            }
          }

          if (checkCollisions()) {
            triggerGameOver();
          }
        } else if (state === 'IDLE') {
          runCycle += dt * 3;
          dinoBody.position.y = 0.95 + Math.sin(runCycle) * 0.03;
        }

        renderer.render(scene, camera);
      }

      animate();
    }

    if (window.THREE) {
      bootDinoGame();
    } else {
      const fallback = document.createElement('script');
      fallback.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';
      fallback.onload = bootDinoGame;
      fallback.onerror = bootDinoGame;
      document.head.appendChild(fallback);
    }
  </script>
</body>
</html>
