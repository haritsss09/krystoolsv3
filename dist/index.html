<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KrysTools</title>
  <meta name="description" content="Developer, network, security, text, image and public data tools. Most run entirely in your browser.">
  <meta name="color-scheme" content="dark">
  <link rel="preload" href="assets/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div class="bg-video" aria-hidden="true"><video autoplay muted loop playsinline preload="metadata" src="assets/media/background.mp4"></video></div>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Site navigation">
      <div class="sidebar__top">
        <a class="sidebar__brand" href="#/" aria-label="KrysTools home">
          <span class="brand-mark" aria-hidden="true">K<i>&rarr;</i></span>
          <span class="wordmark">Krys<span class="wordmark__tools">Tools</span></span>
        </a>
        <button class="btn btn--ghost btn--icon btn--sm collapse-btn" id="collapse-btn" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.5 4.5v15M15.5 10l-2 2 2 2"/></svg>
        </button>
      </div>
      <button class="side-search" id="side-search" type="button" aria-haspopup="dialog">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <span class="side-search__text">Search tools</span>
        <span class="side-search__keys"><kbd>Ctrl</kbd><kbd>K</kbd></span>
      </button>
      <nav class="nav" id="nav" aria-label="Primary"></nav>
      <div class="sidebar__foot">
        <a class="sidebar__foot-text" id="account-foot" href="#/account">Pins and recent tools stay on this device. Sign in to sync them.</a>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main-col">
      <header class="topbar" id="topbar">
        <button class="btn btn--ghost btn--icon menu-btn" id="menu-btn" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <a class="topbar__brand" href="#/"><span class="brand-mark" aria-hidden="true">K<i>&rarr;</i></span><span class="wordmark">Krys<span class="wordmark__tools">Tools</span></span></a>
        <nav class="topbar__crumb" id="crumb" aria-label="Breadcrumb"></nav>
        <span class="topbar__spacer"></span>
        <button class="search-trigger" id="search-trigger" type="button" aria-haspopup="dialog">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <span>Search tools</span>
          <span class="search-trigger__keys"><kbd>Ctrl</kbd><kbd>K</kbd></span>
        </button>
        <span class="scroll-progress" id="scroll-progress" aria-hidden="true"></span>
      </header>
      <div class="announce" id="announce" role="status" hidden></div>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <dialog class="palette" id="palette" aria-labelledby="palette-title">
    <div class="palette__head">
      <h2 id="palette-title">Find a tool</h2>
      <button class="btn btn--ghost btn--icon btn--sm" id="palette-close" type="button" aria-label="Close search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="palette__bar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input class="palette__input" id="palette-input" type="search" placeholder="Search tools by name, task or format" aria-label="Search tools" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list"><kbd>Esc</kbd></div>
    <ul class="palette__list" id="palette-list" role="listbox" aria-label="Matching tools"></ul>
    <div class="palette__foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
  </dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="assets/js/core/app.js"></script>
</body>
</html>
